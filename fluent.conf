## Supra Log Collector Configuration (Fluentd)  — hardened 2026-05-21
##
## Collects logs from: IEDs, Switches, Routers, Firewalls,
##                     Windows Workstations/Servers, Linux Servers
##
## Ports:
##    514/UDP+TCP  - IED syslog (timestamps in UTC)
##   1514/UDP+TCP  - Windows NXLog agents (JSON, IST)   <-- TCP added for large events
##   2514/UDP+TCP  - Network devices: switches, routers, firewalls (IST)
##  24224/TCP      - Fluentd forward input (from Fluentd agents)
##
## Reliability changes vs. previous config:
##   * Per-source indices (supra-ied / supra-network / supra-windows / supra-logs)
##     so one source's field types can never reject another source's docs.
##   * File buffers (survive service restarts) instead of memory buffers.
##   * log_os_400_reason on every output so OpenSearch tells us WHY a doc is rejected.
##   * Oversized syslog frames truncated before buffering (fixes BufferChunkOverflow).
##   * network filter fixed: in_syslog suffixes the tag, so it must be network.**
##   * Companion index template (supra-index-template.sh) maps every dynamic field
##     as keyword + ignore_malformed, which removes the 400 mapping conflicts entirely.

## ============================================================
## SYSTEM
## ============================================================
<system>
  log_level info
</system>

## ============================================================
## INPUT SOURCES
## ============================================================

# IED (Port 514 - UTC)
<source>
  @type syslog
  port 514
  bind 0.0.0.0
  tag ied
  protocol_type udp
  message_length_limit 65535
  <parse>
    message_format auto
    timezone +00:00
  </parse>
</source>

<source>
  @type syslog
  port 514
  bind 0.0.0.0
  tag ied
  protocol_type tcp
  <parse>
    message_format auto
    timezone +00:00
  </parse>
</source>

# Windows (Port 1514 - JSON - IST) — UDP kept for backward compatibility
<source>
  @type udp
  port 1514
  bind 0.0.0.0
  tag windows
  message_length_limit 65535
  <parse>
    @type json
    time_key EventTime
    time_format %Y-%m-%d %H:%M:%S
    timezone +05:30
    keep_time_key true
  </parse>
</source>

# Windows (Port 1514 - JSON - IST) — TCP: reliable, no truncation of large events.
# Configure NXLog with om_tcp (see nxlog.conf).
<source>
  @type tcp
  port 1514
  bind 0.0.0.0
  tag windows
  delimiter "\n"
  <parse>
    @type json
    time_key EventTime
    time_format %Y-%m-%d %H:%M:%S
    timezone +05:30
    keep_time_key true
  </parse>
</source>

# Network Devices (Switches/Routers/Firewalls - Port 2514 - IST)
<source>
  @type syslog
  port 2514
  bind 0.0.0.0
  tag network
  protocol_type udp
  message_length_limit 65535
  emit_unmatched_lines true
  <parse>
    message_format auto
    timezone +05:30
  </parse>
</source>

<source>
  @type syslog
  port 2514
  bind 0.0.0.0
  tag network
  protocol_type tcp
  emit_unmatched_lines true
  <parse>
    message_format auto
    timezone +05:30
  </parse>
</source>

# Fluent Forward
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Linux Servers (rsyslog - Port 5140 - IST) — this host and other Linux hosts.
# Kept off 514 so the IED pipe-parser never touches generic Linux syslog.
# Configure rsyslog with:  *.*  @@127.0.0.1:5140   (see /etc/rsyslog.d/60-supra-forward.conf)
<source>
  @type syslog
  port 5140
  bind 0.0.0.0
  tag linux
  protocol_type udp
  message_length_limit 65535
  <parse>
    message_format auto
    timezone +05:30
  </parse>
</source>

<source>
  @type syslog
  port 5140
  bind 0.0.0.0
  tag linux
  protocol_type tcp
  message_length_limit 65535
  <parse>
    message_format auto
    timezone +05:30
  </parse>
</source>

## ============================================================
## SAFETY: truncate oversized syslog frames before they hit the buffer
## (a single >chunk_limit_size record otherwise raises BufferChunkOverflowError)
## ============================================================
<filter ied.**>
  @type record_transformer
  enable_ruby true
  <record>
    message ${m = record["message"].to_s; m.length > 60000 ? m[0, 60000] : m}
  </record>
</filter>

<filter network.**>
  @type record_transformer
  enable_ruby true
  <record>
    message ${m = record["message"].to_s; m.length > 60000 ? m[0, 60000] : m}
  </record>
</filter>

## ============================================================
## IED PROCESSING (Hitachi Energy REC670 / REL670)
## ============================================================
## REC670 syslog message format (pipe-delimited):
##   01:Log-in successful|Accesspoint:1|1110|01135|AA1D1Q19KF1|REC670|Administrator
## Fields: priority:description|detail|event_code|sequence|device_id|ied_model|user
<filter ied.**>
  @type record_transformer
  enable_ruby true
  <record>
    event_description ${parts = record["message"].to_s.gsub(/\x00/, "").strip.split("|"); desc = parts[0].to_s; desc.include?(":") ? desc.split(":", 2)[1].to_s.strip : desc}
    event_detail ${parts = record["message"].to_s.gsub(/\x00/, "").strip.split("|"); parts.length >= 2 ? parts[1].to_s.strip : ""}
    event_code ${parts = record["message"].to_s.gsub(/\x00/, "").strip.split("|"); parts.length >= 3 ? parts[2].to_s.strip : ""}
    sequence ${parts = record["message"].to_s.gsub(/\x00/, "").strip.split("|"); parts.length >= 4 ? parts[3].to_s.strip : ""}
    device_id ${parts = record["message"].to_s.gsub(/\x00/, "").strip.split("|"); parts.length >= 5 ? parts[4].to_s.strip : record["host"].to_s}
    ied_model ${parts = record["message"].to_s.gsub(/\x00/, "").strip.split("|"); parts.length >= 6 ? parts[5].to_s.strip : "unknown"}
    user ${parts = record["message"].to_s.gsub(/\x00/, "").strip.split("|"); parts.length >= 7 ? parts[6].to_s.strip : "unknown"}
    event_type ${msg = record["message"].to_s.downcase; msg.include?("trip") ? "trip" : msg.include?("fault") ? "fault" : msg.include?("alarm") ? "alarm" : msg.include?("log-in") ? "login" : msg.include?("log-out") ? "logout" : msg.include?("configuration") ? "config_change" : "info"}
    severity ${msg = record["message"].to_s.downcase; (msg.include?("trip") || msg.include?("fault")) ? "critical" : msg.include?("alarm") ? "warning" : "info"}
    log_collector "supra"
    source_type "ied"
  </record>
</filter>

## ============================================================
## NETWORK (SWITCH) PROCESSING   — tag is network.<facility>.<severity>, so network.**
## ============================================================
<filter network.**>
  @type record_transformer
  enable_ruby true
  <record>
    switch_name ${m = record["message"].to_s; m[/\bKC\d+\b/] || "unknown"}
    event_type ${msg = record["message"].to_s.downcase; (msg.include?("link down") || msg.include?("interface down")) ? "link_down" : (msg.include?("link up") || msg.include?("interface up")) ? "link_up" : msg.include?("authentication failed") ? "auth_failed" : msg.include?("logged in") ? "login" : msg.include?("logged out") ? "logout" : msg.include?("configuration") ? "config_change" : msg.include?("snmp") ? "snmp_event" : msg.include?("ntp") ? "ntp_event" : msg.include?("syslog") ? "syslog_event" : (msg.include?("reboot") || msg.include?("restart")) ? "device_restart" : "info"}
    severity ${msg = record["message"].to_s.downcase; (msg.include?("critical") || msg.include?("failed") || msg.include?("down")) ? "critical" : msg.include?("warning") ? "warning" : "info"}
    raw_message ${record["message"]}
    source_type "network"
    log_collector "supra"
  </record>
</filter>

## ============================================================
## WINDOWS PROCESSING  — drop noisy/high-cardinality fields to limit field count
## ============================================================
<filter windows>
  @type record_transformer
  remove_keys MessageId,ProviderGuid,Keywords,Opcode,ThreadID,ProcessID,Version
  <record>
    source_type "windows"
    log_collector "supra"
  </record>
</filter>

## ============================================================
## LINUX PROCESSING  — tag is linux.<facility>.<severity>, so linux.**
## Falls through to the catch-all <match **> -> supra-logs index.
## ============================================================
<filter linux.**>
  @type record_transformer
  enable_ruby true
  <record>
    message ${m = record["message"].to_s; m.length > 60000 ? m[0, 60000] : m}
    source_type "linux"
    log_collector "supra"
  </record>
</filter>

## ============================================================
## OUTPUT (OPENSEARCH) — one index per source type
## ============================================================

# --- IED ---
<match ied.**>
  @type opensearch
  host localhost
  port 9200
  scheme https
  ssl_verify false
  user admin
  password admin
  logstash_format true
  logstash_prefix supra-ied
  include_tag_key true
  tag_key fluentd_tag
  log_os_400_reason true
  reconnect_on_error true
  reload_on_failure true
  reload_connections false
  request_timeout 30s
  <buffer>
    @type file
    path /opt/supra/log-collector/buffer/ied
    flush_mode interval
    flush_interval 5s
    flush_thread_count 2
    retry_max_interval 30s
    retry_forever true
    chunk_limit_size 16MB
    total_limit_size 8GB
    overflow_action block
  </buffer>
</match>

# --- Network devices ---
<match network.**>

########################################################################
# NXLog Configuration for Windows Machines
# Forwards Windows Event Logs to Supra SIEM Log Collector
#
# Installation:
#   1. Download NXLog CE from https://nxlog.co/downloads/nxlog-ce
#   2. Install with default settings
#   3. Replace C:\Program Files\nxlog\conf\nxlog.conf with this file
#   4. Update SUPRA_SERVER_IP below with your Supra server's IP
#   5. Restart nxlog service:
#        PowerShell: Restart-Service nxlog
#        Or: net stop nxlog && net start nxlog
########################################################################

## ============================================================
##  CHANGE THIS to your Supra SIEM server IP address
## ============================================================
define SUPRA_SERVER_IP   192.168.1.100
define SUPRA_PORT        1514

## ============================================================
##  DEBUG CONFIGURATION
##  To ENABLE:  set LogLevel to DEBUG
##  To DISABLE: set LogLevel to INFO
##  Levels: DEBUG, INFO, WARNING, ERROR, CRITICAL
## ============================================================
define LOGLEVEL  INFO

## Global settings
define ROOT     C:\Program Files\nxlog
define CERTDIR  %ROOT%\cert
define CONFDIR  %ROOT%\conf
define LOGDIR   %ROOT%\data
define LOGFILE  %LOGDIR%\nxlog.log
PidFile         %LOGDIR%\nxlog.pid
LogLevel        %LOGLEVEL%

Moduledir %ROOT%\modules
CacheDir  %ROOT%\data
SpoolDir  %ROOT%\data

## ============================================================
##  EXTENSIONS
## ============================================================

<Extension _syslog>
    Module  xm_syslog
</Extension>

## ============================================================
##  INPUT - Windows Event Logs
## ============================================================

# Collect Security, System, and Application event logs
<Input eventlog>
    Module  im_msvistalog
    <QueryXML>
        <QueryList>
            <Query Id="0">
                <Select Path="Security">*</Select>
                <Select Path="System">*</Select>
                <Select Path="Application">*</Select>
            </Query>
        </QueryList>
    </QueryXML>
</Input>

# Collect PowerShell logs (script execution, commands)
<Input powershell>
    Module  im_msvistalog
    <QueryXML>
        <QueryList>
            <Query Id="0">
                <Select Path="Windows PowerShell">*</Select>
            </Query>
        </QueryList>
    </QueryXML>
</Input>

## ============================================================
##  OUTPUT - Send to Supra via Syslog UDP
## ============================================================

<Output supra>
    Module  om_udp
    Host    %SUPRA_SERVER_IP%
    Port    %SUPRA_PORT%
    Exec    to_json();
</Output>

## ============================================================
##  DEBUG OUTPUT - Write to local file (enable/disable)
##
##  To ENABLE:  uncomment the Output and add "debug_file" to Route
##              Path: eventlog, powershell => supra, debug_file
##  To DISABLE: comment out the Output and remove from Route
## ============================================================

#<Output debug_file>
#    Module  om_file
#    File    "%LOGDIR%\debug-output.log"
#    Exec    to_json();
#</Output>

## ============================================================
##  ROUTES
## ============================================================

# Normal route: send to Supra server
# To add debug: change to => supra, debug_file
<Route main>
    Path    eventlog, powershell => supra
</Route>

## Supra Log Collector Configuration (Fluentd / td-agent)
## For Windows Server deployment
##
## Collects logs from: Workstations, Servers, Firewalls, Routers,
##                     Switches, IEDs, and other network devices
##
## Ports:
##   5140/UDP  - Syslog input (from network devices, NXLog agents)
##  24224/TCP  - Fluentd forward input (from Fluentd agents)

# ============================================================
#  DEBUG CONFIGURATION
#  Set @log_level to "debug" to enable, "info" to disable
#  Levels: fatal, error, warn, info, debug, trace
# ============================================================
<system>
  log_level info
</system>

# ============================================================
#  INPUTS
# ============================================================

# Syslog input (UDP) - receives from all devices and NXLog agents
<source>
  @type syslog
  port 5140
  bind 0.0.0.0
  tag syslog
  @log_level info
  <parse>
    message_format auto
  </parse>
</source>

# Forward input - receives from other Fluentd agents
<source>
  @type forward
  port 24224
  bind 0.0.0.0
  @log_level info
</source>

# ============================================================
#  DEBUG - Log incoming messages to file (enable/disable)
#
#  To ENABLE:  change @type from "null" to "file"
#  To DISABLE: change @type from "file" to "null"
# ============================================================

# Debug: Copy all syslog messages to debug log file
<match debug.syslog.**>
  @type null
  # To enable debug logging, replace the above line with:
  # @type file
  # path C:/opt/td-agent/debug/syslog-debug
  # append true
  # <format>
  #   @type json
  # </format>
  # <buffer>
  #   @type memory
  #   flush_interval 1s
  # </buffer>
</match>

# ============================================================
#  ENRICHMENT
# ============================================================

# Add metadata to all syslog messages
<filter syslog.**>
  @type record_transformer
  <record>
    log_collector "supra"
  </record>
</filter>

# ============================================================
#  DEBUG - stdout copy (enable/disable)
#
#  To ENABLE:  uncomment the <store> with @type stdout
#  To DISABLE: comment out the <store> with @type stdout
#
#  When enabled, every log message is printed to the Fluentd
#  console / log-collector-stdout.log for troubleshooting.
# ============================================================

<match **>
  @type copy

  # Store 1: OpenSearch (always active)
  <store>
    @type opensearch
    host localhost
    port 9200
    scheme https
    ssl_verify false
    user admin
    password admin
    logstash_format true
    logstash_prefix supra-logs
    include_tag_key true
    tag_key fluentd_tag
    flush_interval 5s
    @log_level info
    <buffer>
      @type memory
      flush_mode interval
      flush_interval 5s
      retry_max_interval 30s
      retry_forever true
      chunk_limit_size 4MB
      queue_limit_length 64
    </buffer>
  </store>

  # Store 2: Debug to stdout (ENABLE/DISABLE here)
  # Prints every received log to log-collector-stdout.log
  # >>> To ENABLE:  remove the # from the 3 lines below
  # >>> To DISABLE: add # to the 3 lines below
  #<store>
  #  @type stdout
  #</store>

</match>

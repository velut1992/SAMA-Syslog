## Supra Log Collector Configuration (Fluentd)
##
## Collects logs from: IEDs, Switches, Routers, Firewalls,
##                     Windows Workstations/Servers, Linux Servers
##
## Ports:
##    514/UDP+TCP  - IED syslog (timestamps in UTC)
##   1514/UDP      - Windows NXLog agents (JSON format, IST)
##   2514/UDP+TCP  - Network devices: switches, routers, firewalls (timestamps in IST)
##  24224/TCP      - Fluentd forward input (from Fluentd agents)
##
## Port Assignment Guide:
##   IEDs (ABB REC670, REL670, etc.)     → configure syslog to port 514
##   Siemens Ruggedcom switches           → configure syslog to port 2514
##   Routers / Firewalls                  → configure syslog to port 2514
##   Windows servers (NXLog)              → configure NXLog to port 1514
##   Linux servers (rsyslog)              → configure rsyslog to port 514

# ============================================================
#  SYSTEM
# ============================================================
<system>
  log_level info
</system>

# ============================================================
#  INPUT: IEDs (Port 514) — timestamps in UTC
# ============================================================
<source>
  @type syslog
  port 514
  bind 0.0.0.0
  tag ied
  protocol_type udp
  @log_level info
  <parse>
    message_format auto
    timezone +00:00
  </parse>
</source>

<source>
  @type syslog
  port 514
  bind 0.0.0.0
  tag ied
  protocol_type tcp
  @log_level info
  <parse>
    message_format auto
    timezone +00:00
  </parse>
</source>

# ============================================================
#  INPUT: Windows NXLog Agents (Port 1514) — JSON format, IST
# ============================================================
<source>
  @type udp
  port 1514
  bind 0.0.0.0
  tag windows
  @log_level info
  <parse>
    @type json
    time_key EventTime
    time_format %Y-%m-%d %H:%M:%S
    timezone +05:30
    keep_time_key true
  </parse>
</source>

# ============================================================
#  INPUT: Network Devices (Port 2514) — timestamps in IST
#  Siemens Ruggedcom switches, routers, firewalls
# ============================================================
<source>
  @type syslog
  port 2514
  bind 0.0.0.0
  tag network
  protocol_type udp
  @log_level info
  <parse>
    message_format auto
    timezone +05:30
  </parse>
</source>

<source>
  @type syslog
  port 2514
  bind 0.0.0.0
  tag network
  protocol_type tcp
  @log_level info
  <parse>
    message_format auto
    timezone +05:30
  </parse>
</source>

# ============================================================
#  INPUT: Fluentd Forward (Port 24224)
# ============================================================
<source>
  @type forward
  port 24224
  bind 0.0.0.0
  @log_level info
</source>

# ============================================================
#  ENRICHMENT
# ============================================================

# Tag IED logs with source type
<filter ied.**>
  @type record_transformer
  <record>
    log_collector "supra"
    source_type "ied"
  </record>
</filter>

# Tag Windows logs with source type
<filter windows>
  @type record_transformer
  <record>
    log_collector "supra"
    source_type "windows"
  </record>
</filter>

# Tag network device logs with source type
<filter network.**>
  @type record_transformer
  <record>
    log_collector "supra"
    source_type "network"
  </record>
</filter>

# ============================================================
#  OUTPUT — All logs to OpenSearch
# ============================================================
<match **>
  @type opensearch
  host localhost
  port 9200
  scheme https
  ssl_verify false
  user admin
  password admin
  logstash_format true
  logstash_prefix supra-logs
  include_tag_key true
  tag_key fluentd_tag
  flush_interval 5s
  @log_level info
  <buffer>
    @type memory
    flush_mode interval
    flush_interval 5s
    retry_max_interval 30s
    retry_forever true
    chunk_limit_size 4MB
    queue_limit_length 64
  </buffer>
</match>

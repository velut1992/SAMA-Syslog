## NXLog config — hardened 2026-05-21
## Change vs. previous: om_udp -> om_tcp so large Windows events are NOT
## truncated/dropped at the 64 KB UDP datagram limit. TCP is line-delimited
## JSON, which the Fluentd `@type tcp` source on port 1514 reads directly.

define ROOT C:\Program Files\nxlog
#define ROOT C:\Program Files (x86)\nxlog
define CERT %ROOT%\cert

Moduledir %ROOT%\modules
CacheDir %ROOT%\data
Pidfile %ROOT%\data\nxlog.pid
SpoolDir %ROOT%\data
LogFile %ROOT%\data\nxlog.log

<Extension json>
    Module      xm_json
</Extension>

<Extension syslog>
    Module      xm_syslog
</Extension>

<Input internal>
    Module      im_internal
</Input>

# Windows Event Log
<Input eventlog>
    Module      im_msvistalog
# For Windows XP/2000/2003 use im_mseventlog instead:
#   Module    im_mseventlog
</Input>

# Send to Supra Log Collector over TCP (reliable, no size limit).
# to_json() builds the JSON; om_tcp is line-based, so each event ends with \n,
# which matches the Fluentd tcp source `delimiter "\n"`.
<Output out>
    Module      om_tcp
    Host        172.20.98.8
    Port        1514
    Exec        to_json();
</Output>

<Route 1>
    Path        eventlog => out
</Route>
